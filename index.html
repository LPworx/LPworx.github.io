<style>
  :root {
    --bg:        #f5f7fb;
    --surface:   #ffffff;
    --ink:       #101a2e;
    --ink-soft:  #5d6c86;
    --ink-faint: #93a0b6;
    --brand:     #2174c4;   /* LP brand blue */
    --brand-dk:  #185a9c;
    --line:      #e6eaf2;
    --line-soft: #eef1f6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background:
      radial-gradient(900px 480px at 50% -200px, #e7eefb 0%, transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: clamp(40px, 8vw, 96px) clamp(20px, 5vw, 40px) 72px;
  }

  .wrap { max-width: 940px; margin: 0 auto; }

  /* ---------- hero ---------- */
  .hero {
    text-align: center;
    margin-bottom: clamp(44px, 7vw, 76px);
    animation: rise .7s cubic-bezier(.2,.7,.2,1) both;
  }

  .hero .logo {
    width: clamp(76px, 13vw, 104px);
    height: clamp(76px, 13vw, 104px);
    border-radius: 50%;
    display: block;
    margin: 0 auto 26px;
    box-shadow: 0 10px 30px -8px rgba(33,116,196,.45), 0 2px 6px rgba(16,26,46,.06);
  }

  .hero h1 {
    font-weight: 800;
    font-size: clamp(40px, 9vw, 68px);
    letter-spacing: -0.035em;
    line-height: 1;
  }
  .hero h1 .worx { color: var(--brand); }

  .hero .tagline {
    font-family: 'DM Mono', monospace;
    font-size: clamp(12px, 2.4vw, 14px);
    color: var(--ink-soft);
    margin-top: 16px;
    letter-spacing: 0.01em;
  }

  /* ---------- section label ---------- */
  .label {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-faint);
    margin-bottom: 22px;
  }
  .label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ---------- app grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: clamp(14px, 1.8vw, 18px);
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px 24px 22px;
    box-shadow: 0 1px 2px rgba(16,26,46,.04);
    transition: transform .22s cubic-bezier(.2,.7,.2,1), border-color .22s, box-shadow .22s;
    animation: rise .6s cubic-bezier(.2,.7,.2,1) both;
  }
  .card:nth-child(1){ animation-delay:.04s } .card:nth-child(2){ animation-delay:.08s }
  .card:nth-child(3){ animation-delay:.12s } .card:nth-child(4){ animation-delay:.16s }
  .card:nth-child(5){ animation-delay:.20s } .card:nth-child(6){ animation-delay:.24s }

  .card:hover {
    transform: translateY(-4px);
    border-color: #cfe0f3;
    box-shadow: 0 18px 36px -16px rgba(33,116,196,.35), 0 2px 6px rgba(16,26,46,.05);
  }

  .card .ico {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: #eef4fc;
    display: flex; align-items: center; justify-content: center;
    font-size: 23px;
    margin-bottom: 18px;
    transition: background .22s;
  }
  .card:hover .ico { background: #e3eefb; }

  .card .name {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.01em;
    margin-bottom: 5px;
  }
  .card .blurb {
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.55;
    flex: 1;
  }
  .card .go {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--brand);
    margin-top: 18px;
    display: flex; align-items: center; gap: 6px;
    font-weight: 500;
  }
  .card .go span { transition: transform .22s; }
  .card:hover .go span { transform: translateX(4px); }

  /* ---------- footer ---------- */
  footer {
    margin-top: clamp(46px, 8vw, 72px);
    padding-top: 26px;
    border-top: 1px solid var(--line);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--ink-faint);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  footer a { color: var(--ink-soft); text-decoration: none; }
  footer a:hover { color: var(--brand); }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .hero, .card { animation: none; } }
</style>

<script>
  // =====================================================================
  //  YOUR APPS  -  add / edit / remove lines here. That is the whole job.
  //  Each becomes a tile linking to lpworx.com/<path>
  // =====================================================================
  const APPS = [
    { name: "Tichu Scorer",  blurb: "Keep score for a night of Tichu.",        path: "tichu-scorer", icon: "\uD83C\uDCCF" },
    { name: "Grind Log",     blurb: "Workout accountability + leaderboard.",    path: "grind-log",    icon: "\uD83C\uDFCB\uFE0F" },
    { name: "Game Night",    blurb: "Timer, dice, and a live scoreboard.",      path: "game-night",   icon: "\uD83C\uDFB2" },
    { name: "Date Night",    blurb: "Date ideas and conversation starters.",    path: "date-night",   icon: "\uD83C\uDF19" },
    { name: "Moon Phase",    blurb: "Tonight's phase of the moon.",             path: "moon-phase",   icon: "\uD83C\uDF15" },
    // { name: "New App",   blurb: "What it does.",   path: "repo-name",   icon: "\u2728" },
  ];

  // ---- renders the tiles. No need to touch anything below. ----
  const grid = document.getElementById("grid");
  APPS.forEach(app => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "/" + app.path + "/";
    a.innerHTML =
      '<div class="ico">' + app.icon + '</div>' +
      '<div class="name">' + app.name + '</div>' +
      '<div class="blurb">' + app.blurb + '</div>' +
      '<div class="go">Open <span>&rarr;</span></div>';
    grid.appendChild(a);
  });
  document.getElementById("yr").textContent = new Date().getFullYear();
</script>
